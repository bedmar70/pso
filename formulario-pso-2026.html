<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PSO Gestión: Acceso Seguro Prod v7.2</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@4/dark.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body { background-color: #050505; color: #e2e8f0; font-family: sans-serif; }
    
    /* Input Style */
    .cyber-input { 
      background: rgba(255, 255, 255, 0.05); 
      border: 1px solid #333; 
      color: #00f3ff; 
      width: 100%; 
      border-radius: 0.5rem; 
      padding: 0.75rem; 
      font-size: 0.95rem;
      transition: all 0.3s;
    }
    .cyber-input:focus { outline: none; border-color: #00f3ff; box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); }
    .cyber-input::placeholder { color: #6b7280; opacity: 1; }
    
    .hidden-force { display: none !important; }
    label { font-size: 0.75rem; text-transform: uppercase; color: #9ca3af; margin-bottom: 0.25rem; display: block; letter-spacing: 0.05em; }
    label.required { color: #00f3ff; font-weight: bold; }
    label.dynamic-req { color: #00f3ff !important; font-weight: bold !important; }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #00f3ff; }

    /* Animación simple */
    .fade-in { animation: fadeIn 0.5s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="p-4 flex justify-center items-center min-h-screen bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">

  <div id="viewLogin" class="w-full max-w-md bg-gray-900/90 p-8 rounded-2xl border border-[#00f3ff]/30 shadow-[0_0_30px_rgba(0,243,255,0.1)] backdrop-blur-sm fade-in">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-white mb-2">PSO <span class="text-[#00f3ff]">ACCESS</span></h1>
      <p class="text-gray-400 text-xs tracking-widest">IDENTIFICACIÓN REQUERIDA</p>
    </div>

    <form id="loginForm" class="space-y-6">
      <div>
        <label>Email Corporativo</label>
        <input type="email" id="loginEmail" class="cyber-input text-center" placeholder="usuario@pso.com" required>
      </div>
      <div>
        <label>Contraseña</label>
        <input type="password" id="loginPass" class="cyber-input text-center" placeholder="••••••••" required>
      </div>
      <button type="submit" id="btnLogin" class="w-full bg-[#00f3ff] text-black font-bold py-3 rounded hover:bg-white transition-all shadow-lg hover:shadow-[#00f3ff]/50">
        INICIAR SESIÓN
      </button>
    </form>
  </div>


  <div id="viewApp" class="w-full max-w-4xl bg-gray-900/90 p-6 rounded-xl border border-gray-700 shadow-2xl hidden-force fade-in">
    
    <div class="border-b border-gray-700 pb-4 mb-6 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-white">PSO <span class="text-[#00f3ff]">SYSTEM</span></h1>
        <p class="text-xs text-gray-400 mt-1">PANEL DE GESTIÓN v7.2</p>
      </div>
      <div class="text-right text-xs">
        <div class="text-[#00f3ff] font-bold" id="displayUser">USUARIO</div>
        <button onclick="logout()" class="text-red-400 hover:text-white underline mt-1 cursor-pointer">Cerrar Sesión</button>
      </div>
    </div>

    <form id="gestionForm" class="space-y-6">
      
      <div class="col-span-1 md:col-span-2">
        <label class="required">TIPO DE GESTIÓN (Selecciona para empezar)</label>
        <select id="tipoGestion" name="tipo_gestion_comercial" class="cyber-input text-lg font-bold bg-black border-[#00f3ff]" required>
          <option value="">▼ SELECCIONAR OPERACIÓN...</option>
          <option value="Diseño nuevo">🚀 DISEÑO NUEVO</option>
          <option value="Modificación">📝 MODIFICACIÓN</option>
          <option value="Consultas - Varios">❓ CONSULTAS VARIOS</option>
          <option value="Consulta - Precio Cliché">💰 CONSULTA PRECIO CLICHÉS</option>
          <option value="Solicitud de Plano">📐 SOLICITUD DE PLANO</option>
        </select>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <div id="campo_nombreSolicitante" class="hidden-force col-span-1">
          <label class="required">Solicitante *</label>
          <input type="text" name="nombreSolicitante" id="inputNombreSolicitante" class="cyber-input" required>
        </div>
        <div id="campo_emailSolicitante" class="hidden-force col-span-1">
          <label class="required">Email de Contacto *</label>
          <input type="email" name="emailSolicitante" id="inputEmailSolicitante" class="cyber-input" required>
        </div>

        <div id="campo_nombreProyecto" class="hidden-force col-span-1 md:col-span-2">
          <label class="required">Nombre del Proyecto / Identificador *</label>
          <input type="text" name="nombreProyecto" id="inputNombreProyecto" class="cyber-input" placeholder="Ej: Proyecto Alpha - Envase 500ml">
        </div>

        <div id="campo_referenciaPSO" class="hidden-force col-span-1 md:col-span-2">
          <label id="labelReferenciaPSO">Referencia Interna PSO</label>
          <input type="text" name="referenciaPSO" id="inputReferenciaPSO" class="cyber-input" placeholder="Ref. numérica o código">
        </div>

        <div id="campo_cliente" class="hidden-force col-span-1 md:col-span-2">
          <label>Vincular Cliente (Base de Datos)</label>
          <div class="relative" id="containerSearchCliente">
            <input type="text" id="searchCliente" class="cyber-input pl-10" placeholder="Escribe el nombre del cliente para buscar..." autocomplete="off">
            <div id="resCliente" class="absolute z-50 w-full bg-gray-900 border border-[#00f3ff] mt-1 rounded max-h-60 overflow-y-auto hidden shadow-xl"></div>
          </div>
          <div id="selCliente" class="mt-2 p-3 bg-[#00f3ff]/10 border border-[#00f3ff]/30 text-[#00f3ff] text-sm rounded hidden flex justify-between items-center">
            <div class="flex items-center gap-2">
              <span>✅</span> <span id="selClienteText" class="font-bold"></span>
            </div>
            <button type="button" onclick="limpiarSeleccion('cliente')" class="text-red-400 hover:text-red-200 text-xs uppercase font-bold px-2 py-1 border border-red-500/30 rounded hover:bg-red-500/20 transition">
              Eliminar ✕
            </button>
          </div>
          <input type="hidden" name="cliente" id="inputCliente"> 
        </div>

        <div id="campo_buscarProyecto" class="hidden-force col-span-1 md:col-span-2">
          <label>Vincular Proyecto Existente</label>
          <div class="relative" id="containerSearchProyecto">
            <input type="text" id="searchProyecto" class="cyber-input pl-10" placeholder="Escribe el nombre del proyecto..." autocomplete="off">
            <div id="resProyecto" class="absolute z-50 w-full bg-gray-900 border border-[#00f3ff] mt-1 rounded max-h-60 overflow-y-auto hidden shadow-xl"></div>
          </div>
          <div id="selProyecto" class="mt-2 p-3 bg-[#00f3ff]/10 border border-[#00f3ff]/30 text-[#00f3ff] text-sm rounded hidden flex justify-between items-center">
             <div class="flex items-center gap-2">
               <span>✅</span> <span id="selProyectoText" class="font-bold"></span>
             </div>
             <button type="button" onclick="limpiarSeleccion('proyecto')" class="text-red-400 hover:text-red-200 text-xs uppercase font-bold px-2 py-1 border border-red-500/30 rounded hover:bg-red-500/20 transition">
              Eliminar ✕
            </button>
          </div>
          <input type="hidden" name="proyecto_relacionado" id="inputProyecto">
        </div>

        <div id="campo_descripcion" class="hidden-force col-span-1 md:col-span-2">
          <label class="required">Descripción Detallada *</label>
          <textarea name="descripcion" id="inputDescripcion" rows="4" class="cyber-input" placeholder="Describe los detalles de la solicitud, especificaciones, cambios requeridos..."></textarea>
        </div>

        <div id="campo_tipoPlano" class="hidden-force col-span-1">
          <label id="labelTipoPlano">Tipo de plano *</label>
          <select name="tipoPlano" id="inputTipoPlano" class="cyber-input">
            <option value="">- Seleccionar -</option>
            <option value="Lámina Flowpack">Lámina Flowpack</option>
            <option value="Termosellado">Termosellado</option>
            <option value="Doypack">Doypack</option>
            <option value="Saco de doble fuelle">Saco de doble fuelle</option>
            <option value="Bolsa de 3 soldaduras">Bolsa de 3 soldaduras</option>
            <option value="Bolsa para agricultura">Bolsa para agricultura</option>
          </select>
        </div>

        <div id="campo_medidas" class="hidden-force col-span-1">
            <label id="labelMedidas">Medidas (Incluye fuelles, soldaduras...) *</label>
            <input type="text" name="medidas" id="inputMedidas" class="cyber-input" placeholder="Introduce texto">
        </div>

        <div id="campo_maculas" class="hidden-force col-span-1">
            <label id="labelMaculas">Máculas *</label>
            <input type="text" name="maculas" id="inputMaculas" class="cyber-input" placeholder="Introduce texto">
        </div>

        <div id="campo_extrasPlano" class="hidden-force col-span-1">
            <label id="labelExtrasPlano">Extras del plano *</label>
            <input type="text" name="extrasPlano" id="inputExtrasPlano" class="cyber-input" placeholder="Zipper, Válvula, Troquel...">
        </div>

        <div id="campo_prioridadBoceto" class="hidden-force col-span-1">
          <label>Nivel de Prioridad</label>
          <select name="prioridadBoceto" class="cyber-input">
            <option value="Normal">Normal (Estándar)</option>
            <option value="Prioritario">Prioritario</option>
            <option value="Urgente">🚨 URGENTE</option>
          </select>
        </div>

        <div id="campo_necesitaCosteCliches" class="hidden-force col-span-1">
          <label>¿Requiere Coste de Clichés?</label>
          <select name="necesitaCosteCliches" class="cyber-input">
            <option value="">- Seleccionar -</option>
            <option value="SI">SI</option>
            <option value="NO">NO</option>
          </select>
        </div>

        <div id="campo_tipoImpresion" class="hidden-force col-span-1">
          <label id="labelTipoImpresion">Tipo de impresión *</label>
          <select name="tipoImpresion" id="inputTipoImpresion" class="cyber-input">
            <option value="">- Seleccionar -</option>
            <option value="Interior">Interior</option>
            <option value="Exterior">Exterior</option>
          </select>
        </div>

        <div id="campo_materiales" class="hidden-force col-span-1 md:col-span-2">
          <label id="labelMateriales">Materiales / Sustrato *</label>
          <input type="text" name="materiales" id="inputMateriales" class="cyber-input" placeholder="Ej: Polietileno, Complejo, Papel...">
        </div>
        
        <div id="campo_enlaceDiseno" class="hidden-force col-span-1 md:col-span-2">
          <label>Enlace a Archivos (Nube)</label>
          <input type="url" name="enlaceDiseno" class="cyber-input" placeholder="https://drive.google.com/...">
        </div>
        
        <div id="campo_observaciones" class="hidden-force col-span-1 md:col-span-2">
          <label>Notas Adicionales</label>
          <textarea name="observaciones" rows="2" class="cyber-input" placeholder="Cualquier otra información relevante..."></textarea>
        </div>

        <div id="campo_metricasTecnicas" class="hidden-force col-span-1 md:col-span-2 bg-white/5 p-5 rounded border border-white/10">
           <div class="text-[#00f3ff] font-bold text-sm mb-4 border-b border-white/10 pb-2">MÉTRICAS TÉCNICAS</div>
           <div class="grid grid-cols-3 gap-6">
              <div><label id="labelCaidas">Nº Caídas *</label><input type="number" name="numCaidas" id="inputNumCaidas" class="cyber-input text-center" placeholder="0"></div>
              <div><label id="labelRepeticiones">Repeticiones *</label><input type="number" name="numRepeticiones" id="inputNumRepeticiones" class="cyber-input text-center" placeholder="0"></div>
              <div><label id="labelColores">Nº Colores</label><input type="number" name="numColores" id="inputNumColores" class="cyber-input text-center" placeholder="0"></div>
              <div class="col-span-3">
                <label id="labelBarnices">Aplicación de Barnices *</label>
                <select name="barnices" id="inputBarnices" class="cyber-input">
                  <option value="">- Seleccionar -</option>
                  <option value="SI">SI</option>
                  <option value="NO">NO</option>
                </select>
              </div>
           </div>
        </div>

        <div id="campo_archivos" class="hidden-force col-span-1 md:col-span-2 border-2 border-dashed border-gray-600 p-8 text-center rounded-xl cursor-pointer hover:border-[#00f3ff] hover:bg-[#00f3ff]/5 transition-all">
           <div class="text-3xl mb-2">📎</div>
           <p class="text-gray-300 font-bold">Adjuntar Archivos</p>
           <p class="text-xs text-gray-500 mt-1">Haz clic para explorar o arrastra archivos aquí</p>
           <input type="file" id="archivos" multiple class="hidden">
           <div id="listaArchivos" class="mt-4 space-y-2 text-sm text-left"></div>
        </div>

      </div>

      <button type="submit" id="btnEnviar" class="w-full bg-gradient-to-r from-[#00f3ff] to-blue-600 text-black font-bold text-lg py-4 rounded-xl shadow-[0_0_20px_rgba(0,243,255,0.3)] hover:scale-[1.01] transition-transform">
        TRANSMITIR DATOS AL SISTEMA
      </button>

    </form>
  </div>

  <script>
    // URLS N8N
    const WEBHOOKS = {
      login: 'https://n8n.escueladeefectividad.com/webhook/pso-login-comerciales',
      buscarProyectos: 'https://n8n.escueladeefectividad.com/webhook/pso-buscar-proyectos',
      buscarClientes: 'https://n8n.escueladeefectividad.com/webhook/pso-buscar-clientes',
      crearTarea: 'https://n8n.escueladeefectividad.com/webhook/pso-crear-tarea-gestion'
    };

    // --- LOGIN ---
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPass').value;
      const btn = document.getElementById('btnLogin');
      
      btn.disabled = true;
      btn.innerText = 'VERIFICANDO...';

      try {
        const res = await fetch(WEBHOOKS.login, { 
          method: 'POST', 
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ email, password: pass }) 
        });
        const data = await res.json();
        
        if(data.success) {
          document.getElementById('viewLogin').classList.add('hidden-force');
          document.getElementById('viewApp').classList.remove('hidden-force');
          
          const nombreUsuario = data.nombre || (data.usuario && data.usuario.nombre) || "Usuario";
          const emailUsuario = data.email || (data.usuario && data.usuario.email) || email;

          document.getElementById('inputNombreSolicitante').value = nombreUsuario;
          document.getElementById('inputEmailSolicitante').value = emailUsuario;
          document.getElementById('displayUser').textContent = nombreUsuario.toUpperCase();
        } else {
          Swal.fire('Acceso Denegado', 'Credenciales incorrectas.', 'error');
        }
      } catch (err) {
        Swal.fire('Error', 'No se pudo conectar con el servidor.', 'error');
      } finally {
        btn.disabled = false;
        btn.innerText = 'INICIAR SESIÓN';
      }
    });

    window.logout = function() { window.location.reload(); }

    // --- VISIBILIDAD & OBLIGATORIEDAD ---
    // CAMBIOS APLICADOS EN ESTOS ARRAYS
    const TIPOS = {
      'Diseño nuevo': ['nombreSolicitante', 'emailSolicitante', 'nombreProyecto', 'descripcion', 'cliente', 'referenciaPSO', 'prioridadBoceto', 'necesitaCosteCliches', 'tipoImpresion', 'materiales', 'enlaceDiseno', 'archivos'],
      'Modificación': ['nombreSolicitante', 'emailSolicitante', 'nombreProyecto', 'descripcion', 'cliente', 'referenciaPSO', 'prioridadBoceto', 'necesitaCosteCliches', 'tipoImpresion', 'materiales', 'enlaceDiseno', 'archivos', 'observaciones', 'buscarProyecto'],
      'Consultas - Varios': ['nombreSolicitante', 'emailSolicitante', 'descripcion', 'archivos', 'enlaceDiseno', 'observaciones'],
      // CAMBIO 1: Agregado 'tipoImpresion' a la lista
      'Consulta - Precio Cliché': ['nombreSolicitante', 'emailSolicitante', 'nombreProyecto', 'descripcion', 'cliente', 'referenciaPSO', 'necesitaCosteCliches', 'tipoImpresion', 'enlaceDiseno', 'archivos', 'observaciones', 'metricasTecnicas'],
      // CAMBIO 3: Agregado 'cliente' a la lista
      'Solicitud de Plano': ['descripcion', 'archivos', 'emailSolicitante', 'cliente', 'tipoPlano', 'medidas', 'maculas', 'extrasPlano']
    };

    function setObligatorio(idInput, idLabel, obligatorio) {
        const input = document.getElementById(idInput);
        const label = document.getElementById(idLabel);
        if(!input || !label) return;

        if(obligatorio) {
            input.setAttribute('required', 'true');
            label.classList.add('dynamic-req');
        } else {
            input.removeAttribute('required');
            label.classList.remove('dynamic-req');
        }
    }

    document.getElementById('tipoGestion').addEventListener('change', function(e) {
      const seleccion = e.target.value;

      // 1. Ocultar todo
      document.querySelectorAll('[id^="campo_"]').forEach(el => {
        el.classList.add('hidden-force');
        el.style.display = 'none';
      });

      // 2. Resetear obligatoriedad dinámica
      setObligatorio('inputNombreProyecto', 'label', false);
      setObligatorio('inputReferenciaPSO', 'labelReferenciaPSO', false);
      setObligatorio('inputNumCaidas', 'labelCaidas', false);
      setObligatorio('inputNumRepeticiones', 'labelRepeticiones', false);
      setObligatorio('inputNumColores', 'labelColores', false);
      setObligatorio('inputBarnices', 'labelBarnices', false);
      
      setObligatorio('inputTipoPlano', 'labelTipoPlano', false);
      setObligatorio('inputMedidas', 'labelMedidas', false);
      setObligatorio('inputMaculas', 'labelMaculas', false);
      setObligatorio('inputExtrasPlano', 'labelExtrasPlano', false);


      // 3. Aplicar Obligatoriedad Específica
      if (seleccion === 'Modificación') {
        setObligatorio('inputReferenciaPSO', 'labelReferenciaPSO', true);
      }
      
      if (seleccion === 'Consulta - Precio Cliché') {
        setObligatorio('inputNumCaidas', 'labelCaidas', true);
        setObligatorio('inputNumRepeticiones', 'labelRepeticiones', true);
        // CAMBIO 2: Eliminada obligatoriedad de numColores
        // setObligatorio('inputNumColores', 'labelColores', true); 
        setObligatorio('inputBarnices', 'labelBarnices', true);
      }

      if (seleccion === 'Solicitud de Plano') {
        setObligatorio('inputTipoPlano', 'labelTipoPlano', true);
        setObligatorio('inputMedidas', 'labelMedidas', true);
        setObligatorio('inputMaculas', 'labelMaculas', true);
        setObligatorio('inputExtrasPlano', 'labelExtrasPlano', true);
      }

      // Hack para required fijo del HTML si está visible
      const reqFijos = ['inputNombreProyecto', 'inputMateriales', 'inputTipoImpresion', 'inputDescripcion'];
      reqFijos.forEach(id => {
          const el = document.getElementById(id);
          if(el) {
              const parentId = el.closest('div[id^="campo_"]').id.replace('campo_', '');
              const seraVisible = (TIPOS[seleccion] || []).includes(parentId);
              if(seraVisible) el.setAttribute('required', 'true');
              else el.removeAttribute('required');
          }
      });

      if (!seleccion) return;

      // 4. Mostrar campos
      (TIPOS[seleccion] || []).forEach(id => {
        const el = document.getElementById('campo_' + id);
        if(el) { el.classList.remove('hidden-force'); el.style.display = 'block'; }
        if(el && el.classList.contains('md:col-span-2') && window.innerWidth >= 768) el.style.gridColumn = 'span 2 / span 2';
      });
    });

    // --- BÚSQUEDA ---
    let debounceTimer;
    async function buscarEnN8N(query, url, contenedorResultados, tipo) {
      contenedorResultados.innerHTML = '<div class="p-3 text-[#00f3ff] text-xs">Conectando...</div>';
      contenedorResultados.classList.remove('hidden');
      try {
        const res = await fetch(url, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ query }) });
        const datos = await res.json();
        const items = datos.map(d => d.json ? d.json : d).filter(Boolean);

        if(items.length === 0) {
            contenedorResultados.innerHTML = '<div class="p-3 text-gray-500 text-xs">Sin resultados</div>';
            return;
        }

        contenedorResultados.innerHTML = items.map(item => `
            <div class="p-3 hover:bg-[#00f3ff]/10 cursor-pointer border-b border-gray-800 transition-colors"
                 onclick='seleccionarItem(${JSON.stringify(item).replace(/'/g, "&apos;")}, "${tipo}")'>
               <div class="font-bold text-gray-200 text-sm">${item.name}</div>
               <div class="text-[10px] text-[#00f3ff] mt-1">ID: ${item.id || 'N/A'}</div>
            </div>
        `).join('');
      } catch (err) { contenedorResultados.innerHTML = '<div class="p-3 text-red-500 text-xs">Error</div>'; }
    }

    window.seleccionarItem = function(item, tipo) {
       if(tipo === 'cliente') {
           document.getElementById('containerSearchCliente').classList.add('hidden'); 
           document.getElementById('resCliente').classList.add('hidden'); 
           document.getElementById('selClienteText').textContent = item.name;
           document.getElementById('selCliente').classList.remove('hidden');
           document.getElementById('selCliente').classList.add('flex');
           document.getElementById('inputCliente').value = item.name; 
           window.clienteSeleccionado = item;
       } else {
           document.getElementById('containerSearchProyecto').classList.add('hidden');
           document.getElementById('resProyecto').classList.add('hidden');
           document.getElementById('selProyectoText').textContent = item.name;
           document.getElementById('selProyecto').classList.remove('hidden');
           document.getElementById('selProyecto').classList.add('flex');
           document.getElementById('inputProyecto').value = item.id;
           window.proyectoSeleccionado = item;
       }
    };

    window.limpiarSeleccion = function(tipo) {
        if (tipo === 'cliente') {
            document.getElementById('inputCliente').value = '';
            window.clienteSeleccionado = null;
            document.getElementById('selCliente').classList.add('hidden');
            document.getElementById('selCliente').classList.remove('flex');
            document.getElementById('searchCliente').value = '';
            document.getElementById('containerSearchCliente').classList.remove('hidden');
            document.getElementById('searchCliente').focus();
        } else {
            document.getElementById('inputProyecto').value = '';
            window.proyectoSeleccionado = null;
            document.getElementById('selProyecto').classList.add('hidden');
            document.getElementById('selProyecto').classList.remove('flex');
            document.getElementById('searchProyecto').value = '';
            document.getElementById('containerSearchProyecto').classList.remove('hidden');
            document.getElementById('searchProyecto').focus();
        }
    }

    document.getElementById('searchCliente').addEventListener('input', (e) => {
        clearTimeout(debounceTimer);
        if(e.target.value.length < 2) { document.getElementById('resCliente').classList.add('hidden'); return; }
        debounceTimer = setTimeout(() => buscarEnN8N(e.target.value, WEBHOOKS.buscarClientes, document.getElementById('resCliente'), 'cliente'), 300);
    });
    document.getElementById('searchProyecto').addEventListener('input', (e) => {
        clearTimeout(debounceTimer);
        if(e.target.value.length < 2) { document.getElementById('resProyecto').classList.add('hidden'); return; }
        debounceTimer = setTimeout(() => buscarEnN8N(e.target.value, WEBHOOKS.buscarProyectos, document.getElementById('resProyecto'), 'proyecto'), 300);
    });

    // --- ARCHIVOS ---
    const fileInput = document.getElementById('archivos');
    let archivosSeleccionados = [];
    
    document.getElementById('campo_archivos').addEventListener('click', (e) => {
        if(e.target.tagName !== 'BUTTON') { fileInput.click(); }
    });

    fileInput.addEventListener('change', (e) => {
        archivosSeleccionados = [...archivosSeleccionados, ...Array.from(e.target.files)];
        renderizarArchivos();
    });

    function renderizarArchivos() {
        const lista = document.getElementById('listaArchivos');
        if (archivosSeleccionados.length === 0) { lista.innerHTML = ''; return; }
        lista.innerHTML = archivosSeleccionados.map((f, i) => `
            <div class="flex justify-between items-center bg-gray-800 p-2 rounded border border-gray-700">
                <div class="truncate mr-2">
                    <span class="text-gray-300 text-sm">${f.name}</span>
                    <span class="text-[#00f3ff] text-xs ml-2">${(f.size/1024).toFixed(0)} KB</span>
                </div>
                <button type="button" onclick="eliminarArchivo(${i})" class="text-red-500 hover:text-white bg-red-900/30 hover:bg-red-600 px-2 py-1 rounded text-xs font-bold transition">✕</button>
            </div>
        `).join('');
    }

    window.eliminarArchivo = function(index) {
        archivosSeleccionados.splice(index, 1);
        renderizarArchivos();
    }

    // --- ENVÍO ---
    document.getElementById('gestionForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnEnviar');
        btn.disabled = true;
        btn.innerHTML = '<span class="animate-pulse">TRANSMITIENDO...</span>';

        const usuarioActualNombre = document.getElementById('inputNombreSolicitante').value;
        const usuarioActualEmail = document.getElementById('inputEmailSolicitante').value;

        try {
            const formData = new FormData(e.target);
            let descFinal = formData.get('descripcion') || "";
            let infoRollup = "";

            // INYECCIÓN DE DATOS DE PLANO EN LA DESCRIPCIÓN
            const tipoGestion = document.getElementById('tipoGestion').value;
            if (tipoGestion === 'Solicitud de Plano') {
                const tipoPlano = document.getElementById('inputTipoPlano').value;
                const medidas = document.getElementById('inputMedidas').value;
                const maculas = document.getElementById('inputMaculas').value;
                const extras = document.getElementById('inputExtrasPlano').value;

                infoRollup += `\n\n📏 DETALLES DEL PLANO:\n`;
                infoRollup += `• Tipo: ${tipoPlano}\n`;
                infoRollup += `• Medidas: ${medidas}\n`;
                infoRollup += `• Máculas: ${maculas}\n`;
                infoRollup += `• Extras: ${extras}`;
            }

            if(window.clienteSeleccionado) {
                 formData.set('cliente', window.clienteSeleccionado.name);
                 infoRollup += `\n\n📌 CLIENTE VINCULADO: ${window.clienteSeleccionado.name}`;
            }

            if(window.proyectoSeleccionado) {
                 formData.set('proyecto_relacionado', window.proyectoSeleccionado.id);
                 infoRollup += `\n🔗 PROYECTO RELACIONADO: ${window.proyectoSeleccionado.name} (ID: ${window.proyectoSeleccionado.id})`;
            }
            
            if(infoRollup) formData.set('descripcion', descFinal + infoRollup);

            archivosSeleccionados.forEach((f, i) => formData.append(`archivo_${i}`, f));

            const res = await fetch(WEBHOOKS.crearTarea, { method: 'POST', body: formData });
            
            if(res.ok) {
                Swal.fire({
                    title: '¡SOLICITUD ENVIADA!',
                    text: 'Datos registrados correctamente.',
                    icon: 'success',
                    background: '#111',
                    color: '#fff',
                    confirmButtonColor: '#00f3ff',
                    confirmButtonText: 'ENTENDIDO'
                });
                e.target.reset();
                
                document.getElementById('inputNombreSolicitante').value = usuarioActualNombre;
                document.getElementById('inputEmailSolicitante').value = usuarioActualEmail;

                archivosSeleccionados = [];
                renderizarArchivos();
                limpiarSeleccion('cliente');
                limpiarSeleccion('proyecto');
                document.getElementById('tipoGestion').dispatchEvent(new Event('change'));
                
            } else { throw new Error('Error en servidor'); }
        } catch (err) {
            Swal.fire('Error', 'No se pudo contactar con el servidor.', 'error');
        } finally {
            btn.disabled = false;
            btn.innerText = 'TRANSMITIR DATOS AL SISTEMA';
        }
    });
  </script>
</body>
</html>
